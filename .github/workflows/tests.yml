name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check practice_tool/web_assets/dashboard.js

  docker:
    runs-on: ubuntu-latest
    env:
      PRACTICE_ADMIN_PASSWORD: ci-test-only-password
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 120
      - name: Check authenticated API and health endpoint
        run: |
          curl --fail --silent http://127.0.0.1:8765/healthz
          curl --fail --silent -u "admin:$PRACTICE_ADMIN_PASSWORD" http://127.0.0.1:8765/api/dashboard
      - name: Show service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Remove test containers and volumes
        if: always()
        run: docker compose down -v

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/ui_smoke.py
